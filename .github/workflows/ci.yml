name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0

jobs:
  verificar:
    name: typecheck · lint · formato · unitários · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - name: Build (API + front)
        run: pnpm -r --if-present run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          NODE_ENV: production
      - name: Migrations coerentes com o schema
        run: pnpm --filter @workspace/db run check
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  e2e:
    name: e2e (Playwright + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: contafacil_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium do Playwright
        run: pnpm --filter @workspace/gestao-contabil exec playwright install --with-deps chromium
      - name: Suíte e2e
        run: pnpm --filter @workspace/gestao-contabil run e2e
        env:
          CI: "true"
          E2E_DATABASE_URL: postgres://ci:ci@localhost:5432/contafacil_e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/gestao-contabil/playwright-report
            artifacts/gestao-contabil/test-results
          retention-days: 7

  auditoria:
    name: pnpm audit (produção)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades altas ou críticas bloqueiam
        run: pnpm audit --prod --audit-level=high
