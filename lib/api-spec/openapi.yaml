    PeriodoFerias:
      type: object
      required: [id, funcionarioId, funcionarioNome, aquisitivoInicio, aquisitivoFim, limiteGozo, vencendo, vencida, situacao, diasVendidos]
      properties:
        id: { type: integer }
        funcionarioId: { type: integer }
        funcionarioNome: { type: string }
        clienteId: { type: ["integer", "null"] }
        clienteNome: { type: ["string", "null"] }
        aquisitivoInicio: { type: string }
        aquisitivoFim: { type: string }
        gozoInicio: { type: ["string", "null"] }
        gozoFim: { type: ["string", "null"] }
        # Calculado pela API: um ano depois do fim do aquisitivo, o prazo legal
        # para conceder as férias.
        limiteGozo: { type: string }
        # true quando o período ainda não foi gozado e o limite está a 90 dias
        # ou já passou.
        vencendo: { type: boolean }
        # true quando o limite já passou sem gozo: férias devidas em dobro.
        vencida: { type: boolean }
        situacao:
          type: string
          enum: [gozada, vencida, vencendo, a_vencer]
        diasVendidos: { type: integer }
        valor: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    FeriasInput:
      type: object
      required: [funcionarioId, aquisitivoInicio, aquisitivoFim]
      properties:
        id: { type: ["integer", "null"] }
        funcionarioId: { type: integer }
        aquisitivoInicio: { type: string }
        aquisitivoFim: { type: string }
        gozoInicio: { type: ["string", "null"] }
        gozoFim: { type: ["string", "null"] }
        diasVendidos: { type: integer, minimum: 0, maximum: 10 }
        valor: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    FeriasPatch:
      type: object
      properties:
        aquisitivoInicio: { type: string }
        aquisitivoFim: { type: string }
        gozoInicio: { type: ["string", "null"] }
        gozoFim: { type: ["string", "null"] }
        diasVendidos: { type: integer, minimum: 0, maximum: 10 }
        valor: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    FichaFuncionario:
      type: object
      required: [funcionario, folha, ferias]
      properties:
        funcionario: { $ref: "#/components/schemas/Funcionario" }
        folha:
          type: array
          items:
            $ref: "#/components/schemas/LancamentoFolha"
        ferias:
          type: array
          items:
