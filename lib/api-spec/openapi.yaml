openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ContaFácil API — gestão contábil
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clientes
    description: Gestão de clientes
  - name: tipos
    description: Tipos de obrigação
  - name: competencias
    description: Competências mensais
  - name: checklist
    description: Itens do checklist
  - name: pagamentos
    description: Pagamentos de honorários
  - name: pendencias
    description: Pendências e inadimplências
  - name: configuracoes
    description: Configurações do sistema
  - name: painel
    description: Painel de resumo
  - name: processos
    description: Processos avulsos por cliente (troca de titularidade, alteração de endereço…)
  - name: credenciais
    description: Senhas por sistema/obrigação de cada cliente
  - name: debitos
    description: Guias do cliente em atraso com o fisco
  - name: auth
    description: Login e sessão do escritório
  - name: usuarios
    description: Usuários do escritório e seus papéis
  - name: arquivos
    description: Arquivos anexados (guias, comprovantes, documentos)
  - name: avisos
    description: Avisos enviados ao cliente (e-mail, WhatsApp, portal)
  - name: jobs
    description: Fila de tarefas em segundo plano

paths:
  /auth/entrar:
    post:
      operationId: entrar
      tags: [auth]
      summary: Abre uma sessão com login e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciais"
      responses:
        "200":
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoAtual"
        "401":
          description: Login ou senha inválidos

  /auth/sair:
    post:
      operationId: sair
      tags: [auth]
      summary: Encerra a sessão atual
      responses:
        "204":
          description: Sessão encerrada

  /auth/eu:
    get:
      operationId: getSessaoAtual
      tags: [auth]
      summary: Quem está logado e em qual conta
      responses:
        "200":
          description: Sessão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoAtual"
        "401":
          description: Sem sessão

  /auth/trocar-senha:
    post:
      operationId: trocarSenha
      tags: [auth]
      summary: Troca a própria senha (encerra as outras sessões do usuário)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrocarSenhaInput"
      responses:
        "204":
          description: Senha trocada
        "400":
          description: Senha atual não confere

  /auth/sair-de-todos:
    post:
      operationId: sairDeTodos
      tags: [auth]
      summary: Encerra todas as sessões do usuário, inclusive a atual
      responses:
        "204":
          description: Sessões encerradas

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /painel:
    get:
      operationId: getPainel
      tags: [painel]
      summary: Resumo do painel principal
      responses:
        "200":
          description: Dados do painel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Painel"

  /clientes:
    get:
      operationId: listarClientes
      tags: [clientes]
      summary: Lista todos os clientes
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      operationId: criarCliente
      tags: [clientes]
      summary: Cria ou atualiza um cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "200":
          description: Cliente salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}:
    patch:
      operationId: atualizarCliente
      tags: [clientes]
      summary: Atualiza campos avulsos de um cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientePatch"
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
    delete:
      operationId: removerCliente
      tags: [clientes]
      summary: Remove um cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /clientes/{id}/segredos:
    get:
      operationId: getSegredosCliente
      tags: [clientes]
      summary: Revela as senhas gov.br e NFS-e do cliente (fica registrado na auditoria)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Senhas em claro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegredosCliente"
        "403":
          description: O papel do usuário não pode revelar senhas
        "404":
          description: Cliente não encontrado

  /tipos:
    get:
      operationId: listarTipos
      tags: [tipos]
      summary: Lista tipos de obrigação
      responses:
        "200":
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoObrigacao"
    post:
      operationId: salvarTipo
      tags: [tipos]
      summary: Cria ou atualiza tipo de obrigação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipoObrigacaoInput"
      responses:
        "200":
          description: Tipo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoObrigacao"

  /tipos/vincular-automaticos:
    post:
      operationId: vincularAutomaticas
      tags: [tipos]
      summary: Vincula a cada cliente ativo com regime as obrigações automáticas do regime dele (só acrescenta)
      responses:
        "200":
          description: Quantos vínculos foram criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoVinculo"

  /tipos/{id}:
    delete:
      operationId: removerTipo
      tags: [tipos]
      summary: Remove tipo de obrigação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /debitos:
    get:
      operationId: listarDebitos
      tags: [debitos]
      summary: Lista guias em atraso
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusDebito"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de débitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debito"
    post:
      operationId: salvarDebito
      tags: [debitos]
      summary: Cria ou atualiza uma guia em atraso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitoInput"
      responses:
        "200":
          description: Débito salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debito"

  /debitos/{id}:
    patch:
      operationId: atualizarDebito
      tags: [debitos]
      summary: Atualiza campos avulsos de uma guia em atraso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitoPatch"
      responses:
        "200":
          description: Débito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debito"
    delete:
      operationId: removerDebito
      tags: [debitos]
      summary: Remove uma guia em atraso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /credenciais:
    get:
      operationId: listarCredenciais
      tags: [credenciais]
      summary: Lista senhas de todos os clientes
      responses:
        "200":
          description: Lista de credenciais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credencial"
    post:
      operationId: salvarCredencial
      tags: [credenciais]
      summary: Cria ou atualiza uma credencial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialInput"
      responses:
        "200":
          description: Credencial salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credencial"

  /credenciais/{id}:
    patch:
      operationId: atualizarCredencial
      tags: [credenciais]
      summary: Atualiza campos avulsos de uma credencial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialPatch"
      responses:
        "200":
          description: Credencial atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credencial"
    delete:
      operationId: removerCredencial
      tags: [credenciais]
      summary: Remove uma credencial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /credenciais/{id}/senha:
    get:
      operationId: getSenhaCredencial
      tags: [credenciais]
      summary: Revela a senha de um acesso (fica registrado na auditoria)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Senha em claro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenhaRevelada"
        "403":
          description: O papel do usuário não pode revelar senhas
        "404":
          description: Credencial não encontrada

  /processos:
    get:
      operationId: listarProcessos
      tags: [processos]
      summary: Lista processos (opcionalmente filtrados)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusProcesso"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: categoria
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoriaProcesso"
      responses:
        "200":
          description: Lista de processos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Processo"
    post:
      operationId: salvarProcesso
      tags: [processos]
      summary: Cria ou atualiza um processo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessoInput"
      responses:
        "200":
          description: Processo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Processo"

  /processos/{id}:
    get:
      operationId: getProcesso
      tags: [processos]
      summary: Obtém um processo com suas etapas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Processo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoComEtapas"
        "404":
          description: Não encontrado
    delete:
      operationId: removerProcesso
      tags: [processos]
      summary: Remove um processo e suas etapas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /processos/{id}/etapas:
    post:
      operationId: adicionarEtapa
      tags: [processos]
      summary: Adiciona uma etapa ao checklist do processo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtapaInput"
      responses:
        "200":
          description: Etapa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoEtapa"

  /etapas/{id}:
    patch:
      operationId: atualizarEtapa
      tags: [processos]
      summary: Atualiza uma etapa (marcar feito, editar texto)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtapaPatch"
      responses:
        "200":
          description: Etapa atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoEtapa"
    delete:
      operationId: removerEtapa
      tags: [processos]
      summary: Remove uma etapa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /competencias:
    get:
      operationId: listarCompetencias
      tags: [competencias]
      summary: Lista competências com resumo
      responses:
        "200":
          description: Lista de competências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetenciaComResumo"
    post:
      operationId: abrirCompetencia
      tags: [competencias]
      summary: Abre uma nova competência (gera checklist e pagamentos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrirCompetenciaInput"
      responses:
        "200":
          description: Competência criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competencia"

  /competencias/{id}:
    get:
      operationId: getCompetencia
      tags: [competencias]
      summary: Obtém uma competência com resumo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetenciaComResumo"
        "404":
          description: Não encontrado
    delete:
      operationId: removerCompetencia
      tags: [competencias]
      summary: Remove competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /competencias/{id}/sincronizar:
    post:
      operationId: sincronizarCompetencia
      tags: [competencias]
      summary: Acrescenta ao mês os clientes e obrigações incluídos depois da abertura
      description: Idempotente — só cria o que falta; itens e pagamentos existentes não são tocados.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: O que foi acrescentado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoSincronizacao"
        "404":
          description: Competência não encontrada

  /competencias/{id}/checklist:
    get:
      operationId: listarChecklist
      tags: [checklist]
      summary: Lista itens do checklist da competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Itens do checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"

  /competencias/{id}/pagamentos:
    get:
      operationId: listarPagamentos
      tags: [pagamentos]
      summary: Lista pagamentos da competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pagamento"

  /checklist/{id}/status:
    patch:
      operationId: atualizarStatusChecklist
      tags: [checklist]
      summary: Atualiza status de um item do checklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChecklistInput"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /checklist/{id}/vencimento:
    patch:
      operationId: atualizarVencimentoChecklist
      tags: [checklist]
      summary: Atualiza vencimento de um item do checklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VencimentoInput"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /pagamentos/{id}:
    patch:
      operationId: atualizarPagamento
      tags: [pagamentos]
      summary: Atualiza um pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoInput"
      responses:
        "200":
          description: Pagamento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"

  /pendencias:
    get:
      operationId: listarPendencias
      tags: [pendencias]
      summary: Lista obrigações e pagamentos em atraso
      responses:
        "200":
          description: Pendências
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pendencias"

  /pendencias/obrigacoes/{id}/feito:
    patch:
      operationId: marcarObrigacaoFeita
      tags: [pendencias]
      summary: Marca obrigação pendente como enviada (fim do ciclo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marcado

  /pendencias/pagamentos/{id}/pago:
    patch:
      operationId: marcarPagamentoPago
      tags: [pendencias]
      summary: Marca pagamento pendente como pago
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marcado

  /pendencias/cobrancas:
    post:
      operationId: registrarCobranca
      tags: [pendencias]
      summary: Registra que uma cobrança foi disparada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobrancaInput"
      responses:
        "204":
          description: Registrado

  /configuracoes/{chave}:
    get:
      operationId: getConfiguracao
      tags: [configuracoes]
      summary: Obtém uma configuração por chave
      parameters:
        - name: chave
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configuração
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracao"
    put:
      operationId: salvarConfiguracao
      tags: [configuracoes]
      summary: Salva uma configuração
      parameters:
        - name: chave
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguracaoInput"
      responses:
        "200":
          description: Salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracao"

  /perfil:
    get:
      operationId: getPerfil
      tags: [perfil]
      summary: Dados do escritório logado
      responses:
        "200":
          description: Perfil do escritório
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
    put:
      operationId: salvarPerfil
      tags: [perfil]
      summary: Atualiza os dados do escritório
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilInput"
      responses:
        "200":
          description: Perfil salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"

  /despesas:
    get:
      operationId: listarDespesas
      tags: [despesas]
      summary: Lista gastos do escritório e dos clientes
      parameters:
        - name: escopo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EscopoRegistro"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: ano
          in: query
          required: false
          schema:
            type: integer
        - name: mes
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de despesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Despesa"
    post:
      operationId: salvarDespesa
      tags: [despesas]
      summary: Cria ou atualiza um gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DespesaInput"
      responses:
        "200":
          description: Despesa salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Despesa"

  /despesas/{id}:
    patch:
      operationId: atualizarDespesa
      tags: [despesas]
      summary: Atualiza campos avulsos de um gasto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DespesaPatch"
      responses:
        "200":
          description: Despesa atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Despesa"
    delete:
      operationId: removerDespesa
      tags: [despesas]
      summary: Remove um gasto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
