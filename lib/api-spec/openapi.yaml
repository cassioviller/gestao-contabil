openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ContaFácil API — gestão contábil
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clientes
    description: Gestão de clientes
  - name: tipos
    description: Tipos de obrigação
  - name: competencias
    description: Competências mensais
  - name: checklist
    description: Itens do checklist
  - name: pagamentos
    description: Pagamentos de honorários
  - name: pendencias
    description: Pendências e inadimplências
  - name: configuracoes
    description: Configurações do sistema
  - name: painel
    description: Painel de resumo
  - name: processos
    description: Processos avulsos por cliente (troca de titularidade, alteração de endereço…)
  - name: credenciais
    description: Senhas por sistema/obrigação de cada cliente
  - name: debitos
    description: Guias do cliente em atraso com o fisco
  - name: auth
    description: Login e sessão do escritório

paths:
  /auth/entrar:
    post:
      operationId: entrar
      tags: [auth]
      summary: Abre uma sessão com login e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciais"
      responses:
        "200":
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoAtual"
        "401":
          description: Login ou senha inválidos

  /auth/sair:
    post:
      operationId: sair
      tags: [auth]
      summary: Encerra a sessão atual
      responses:
        "204":
          description: Sessão encerrada

  /auth/eu:
    get:
      operationId: getSessaoAtual
      tags: [auth]
      summary: Quem está logado e em qual conta
      responses:
        "200":
          description: Sessão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoAtual"
        "401":
          description: Sem sessão

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /painel:
    get:
      operationId: getPainel
      tags: [painel]
      summary: Resumo do painel principal
      responses:
        "200":
          description: Dados do painel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Painel"

  /clientes:
    get:
      operationId: listarClientes
      tags: [clientes]
      summary: Lista todos os clientes
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      operationId: criarCliente
      tags: [clientes]
      summary: Cria ou atualiza um cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "200":
          description: Cliente salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}:
    patch:
      operationId: atualizarCliente
      tags: [clientes]
      summary: Atualiza campos avulsos de um cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientePatch"
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
    delete:
      operationId: removerCliente
      tags: [clientes]
      summary: Remove um cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /tipos:
    get:
      operationId: listarTipos
      tags: [tipos]
      summary: Lista tipos de obrigação
      responses:
        "200":
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoObrigacao"
    post:
      operationId: salvarTipo
      tags: [tipos]
      summary: Cria ou atualiza tipo de obrigação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipoObrigacaoInput"
      responses:
        "200":
          description: Tipo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoObrigacao"

  /tipos/{id}:
    delete:
      operationId: removerTipo
      tags: [tipos]
      summary: Remove tipo de obrigação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /debitos:
    get:
      operationId: listarDebitos
      tags: [debitos]
      summary: Lista guias em atraso
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusDebito"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de débitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debito"
    post:
      operationId: salvarDebito
      tags: [debitos]
      summary: Cria ou atualiza uma guia em atraso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitoInput"
      responses:
        "200":
          description: Débito salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debito"

  /debitos/{id}:
    patch:
      operationId: atualizarDebito
      tags: [debitos]
      summary: Atualiza campos avulsos de uma guia em atraso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitoPatch"
      responses:
        "200":
          description: Débito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debito"
    delete:
      operationId: removerDebito
      tags: [debitos]
      summary: Remove uma guia em atraso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /credenciais:
    get:
      operationId: listarCredenciais
      tags: [credenciais]
      summary: Lista senhas de todos os clientes
      responses:
        "200":
          description: Lista de credenciais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credencial"
    post:
      operationId: salvarCredencial
      tags: [credenciais]
      summary: Cria ou atualiza uma credencial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialInput"
      responses:
        "200":
          description: Credencial salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credencial"

  /credenciais/{id}:
    patch:
      operationId: atualizarCredencial
      tags: [credenciais]
      summary: Atualiza campos avulsos de uma credencial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialPatch"
      responses:
        "200":
          description: Credencial atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credencial"
    delete:
      operationId: removerCredencial
      tags: [credenciais]
      summary: Remove uma credencial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /processos:
    get:
      operationId: listarProcessos
      tags: [processos]
      summary: Lista processos (opcionalmente filtrados)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusProcesso"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: categoria
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoriaProcesso"
      responses:
        "200":
          description: Lista de processos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Processo"
    post:
      operationId: salvarProcesso
      tags: [processos]
      summary: Cria ou atualiza um processo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessoInput"
      responses:
        "200":
          description: Processo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Processo"

  /processos/{id}:
    get:
      operationId: getProcesso
      tags: [processos]
      summary: Obtém um processo com suas etapas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Processo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoComEtapas"
        "404":
          description: Não encontrado
    delete:
      operationId: removerProcesso
      tags: [processos]
      summary: Remove um processo e suas etapas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /processos/{id}/etapas:
    post:
      operationId: adicionarEtapa
      tags: [processos]
      summary: Adiciona uma etapa ao checklist do processo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtapaInput"
      responses:
        "200":
          description: Etapa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoEtapa"

  /etapas/{id}:
    patch:
      operationId: atualizarEtapa
      tags: [processos]
      summary: Atualiza uma etapa (marcar feito, editar texto)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtapaPatch"
      responses:
        "200":
          description: Etapa atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoEtapa"
    delete:
      operationId: removerEtapa
      tags: [processos]
      summary: Remove uma etapa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /competencias:
    get:
      operationId: listarCompetencias
      tags: [competencias]
      summary: Lista competências com resumo
      responses:
        "200":
          description: Lista de competências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetenciaComResumo"
    post:
      operationId: abrirCompetencia
      tags: [competencias]
      summary: Abre uma nova competência (gera checklist e pagamentos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrirCompetenciaInput"
      responses:
        "200":
          description: Competência criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competencia"

  /competencias/{id}:
    get:
      operationId: getCompetencia
      tags: [competencias]
      summary: Obtém uma competência com resumo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetenciaComResumo"
        "404":
          description: Não encontrado
    delete:
      operationId: removerCompetencia
      tags: [competencias]
      summary: Remove competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /competencias/{id}/checklist:
    get:
      operationId: listarChecklist
      tags: [checklist]
      summary: Lista itens do checklist da competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Itens do checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"

  /competencias/{id}/pagamentos:
    get:
      operationId: listarPagamentos
      tags: [pagamentos]
      summary: Lista pagamentos da competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pagamento"

  /checklist/{id}/status:
    patch:
      operationId: atualizarStatusChecklist
      tags: [checklist]
      summary: Atualiza status de um item do checklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChecklistInput"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /checklist/{id}/vencimento:
    patch:
      operationId: atualizarVencimentoChecklist
      tags: [checklist]
      summary: Atualiza vencimento de um item do checklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VencimentoInput"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /pagamentos/{id}:
    patch:
      operationId: atualizarPagamento
      tags: [pagamentos]
      summary: Atualiza um pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoInput"
      responses:
        "200":
          description: Pagamento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"

  /pendencias:
    get:
      operationId: listarPendencias
      tags: [pendencias]
      summary: Lista obrigações e pagamentos em atraso
      responses:
        "200":
          description: Pendências
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pendencias"

  /pendencias/obrigacoes/{id}/feito:
    patch:
      operationId: marcarObrigacaoFeita
      tags: [pendencias]
      summary: Marca obrigação pendente como enviada (fim do ciclo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marcado

  /pendencias/pagamentos/{id}/pago:
    patch:
      operationId: marcarPagamentoPago
      tags: [pendencias]
      summary: Marca pagamento pendente como pago
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marcado

  /pendencias/cobrancas:
    post:
      operationId: registrarCobranca
      tags: [pendencias]
      summary: Registra que uma cobrança foi disparada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CobrancaInput"
      responses:
        "204":
          description: Registrado

  /configuracoes/{chave}:
    get:
      operationId: getConfiguracao
      tags: [configuracoes]
      summary: Obtém uma configuração por chave
      parameters:
        - name: chave
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configuração
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracao"
    put:
      operationId: salvarConfiguracao
      tags: [configuracoes]
      summary: Salva uma configuração
      parameters:
        - name: chave
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfiguracaoInput"
      responses:
        "200":
          description: Salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracao"

  /perfil:
    get:
      operationId: getPerfil
      tags: [perfil]
      summary: Dados do escritório logado
      responses:
        "200":
          description: Perfil do escritório
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
    put:
      operationId: salvarPerfil
      tags: [perfil]
      summary: Atualiza os dados do escritório
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilInput"
      responses:
        "200":
          description: Perfil salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"

  /despesas:
    get:
      operationId: listarDespesas
      tags: [despesas]
      summary: Lista gastos do escritório e dos clientes
      parameters:
        - name: escopo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EscopoRegistro"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: ano
          in: query
          required: false
          schema:
            type: integer
        - name: mes
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de despesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Despesa"
    post:
      operationId: salvarDespesa
      tags: [despesas]
      summary: Cria ou atualiza um gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DespesaInput"
      responses:
        "200":
          description: Despesa salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Despesa"

  /despesas/{id}:
    patch:
      operationId: atualizarDespesa
      tags: [despesas]
      summary: Atualiza campos avulsos de um gasto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DespesaPatch"
      responses:
        "200":
          description: Despesa atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Despesa"
    delete:
      operationId: removerDespesa
      tags: [despesas]
      summary: Remove um gasto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removida

  /funcionarios:
    get:
      operationId: listarFuncionarios
      tags: [funcionarios]
      summary: Lista funcionários do escritório e dos clientes
      parameters:
        - name: escopo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EscopoRegistro"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: situacao
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SituacaoFuncionario"
      responses:
        "200":
          description: Lista de funcionários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Funcionario"
    post:
      operationId: salvarFuncionario
      tags: [funcionarios]
      summary: Cria ou atualiza um funcionário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuncionarioInput"
      responses:
        "200":
          description: Funcionário salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funcionario"

  /funcionarios/{id}:
    get:
      operationId: getFuncionario
      tags: [funcionarios]
      summary: Ficha do funcionário com folha e férias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ficha do funcionário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FichaFuncionario"
    patch:
      operationId: atualizarFuncionario
      tags: [funcionarios]
      summary: Atualiza campos avulsos de um funcionário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuncionarioPatch"
      responses:
        "200":
          description: Funcionário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funcionario"
    delete:
      operationId: removerFuncionario
      tags: [funcionarios]
      summary: Remove um funcionário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /folha:
    get:
      operationId: listarFolha
      tags: [folha]
      summary: Lançamentos de folha de um mês
      parameters:
        - name: ano
          in: query
          required: true
          schema:
            type: integer
        - name: mes
          in: query
          required: true
          schema:
            type: integer
        - name: escopo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EscopoRegistro"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lançamentos do mês
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LancamentoFolha"
    post:
      operationId: salvarLancamentoFolha
      tags: [folha]
      summary: Cria ou atualiza um lançamento de folha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoFolhaInput"
      responses:
        "200":
          description: Lançamento salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LancamentoFolha"

  /folha/{id}:
    patch:
      operationId: atualizarLancamentoFolha
      tags: [folha]
      summary: Atualiza campos avulsos de um lançamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoFolhaPatch"
      responses:
        "200":
          description: Lançamento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LancamentoFolha"
    delete:
      operationId: removerLancamentoFolha
      tags: [folha]
      summary: Remove um lançamento de folha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido

  /ferias:
    get:
      operationId: listarFerias
      tags: [ferias]
      summary: Períodos de férias, com aviso de vencimento
      parameters:
        - name: escopo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EscopoRegistro"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: funcionarioId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Períodos de férias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeriodoFerias"
    post:
      operationId: salvarFerias
      tags: [ferias]
      summary: Cria ou atualiza um período de férias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeriasInput"
      responses:
        "200":
          description: Período salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodoFerias"

  /ferias/{id}:
    patch:
      operationId: atualizarFerias
      tags: [ferias]
      summary: Atualiza campos avulsos de um período de férias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeriasPatch"
      responses:
        "200":
          description: Período atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodoFerias"
    delete:
      operationId: removerFerias
      tags: [ferias]
      summary: Remove um período de férias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removido
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Credenciais:
      type: object
      required: [login, senha]
      properties:
        login:
          type: string
          minLength: 1
        senha:
          type: string
          minLength: 1

    # Quem está logado. `conta` é o escritório dono dos dados — todo o resto da
    # API responde só o que pertence a ela.
    SessaoAtual:
      type: object
      required: [contaId, conta, login, nome]
      properties:
        contaId: { type: integer }
        conta: { type: string }
        login: { type: string }
        nome: { type: ["string", "null"] }

    Resumo:
      type: object
      required: [obrigacoes, pagamentos]
      properties:
        obrigacoes:
          type: object
          required: [total, feitos, emitidos, pendentes]
          properties:
            total: { type: integer }
            # `feitos` = enviados ao cliente, o fim do ciclo.
            feitos: { type: integer }
            emitidos: { type: integer }
            pendentes: { type: integer }
        pagamentos:
          type: object
          required: [total, pagos, pendentes, recebido, aReceber]
          properties:
            total: { type: integer }
            pagos: { type: integer }
            pendentes: { type: integer }
            recebido: { type: string }
            aReceber: { type: string }

    Painel:
      type: object
      required: [clientesAtivos, competenciaAtual]
      properties:
        clientesAtivos:
          type: integer
        competenciaAtual:
          type: ["object", "null"]
          properties:
            id: { type: integer }
            ano: { type: integer }
            mes: { type: integer }
            resumo:
              $ref: "#/components/schemas/Resumo"

    Cliente:
      type: object
      required: [id, razaoSocial, ativo, obrigacoes]
      properties:
        id: { type: integer }
        codigo: { type: ["integer", "null"] }
        razaoSocial: { type: string }
        cnpj: { type: ["string", "null"] }
        cnaePrincipal: { type: ["string", "null"] }
        regime: { $ref: "#/components/schemas/RegimeTributario" }
        inscricaoEstadual: { type: ["string", "null"] }
        inscricaoMunicipal: { type: ["string", "null"] }
        formaEnvio: { type: ["string", "null"] }
        procuracao: { type: ["string", "null"] }
        procuracaoVencimento: { type: ["string", "null"] }
        socioNome: { type: ["string", "null"] }
        socioCpf: { type: ["string", "null"] }
        senhaGov: { type: ["string", "null"] }
        senhaNfse: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        valorHonorario: { type: ["string", "null"] }
        diaVencimentoHonorario: { type: ["integer", "null"] }
        contatoNome: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        ativo: { type: boolean }
        obrigacoes:
          type: array
          items: { type: integer }

    ClienteInput:
      type: object
      required: [razaoSocial]
      properties:
        id: { type: ["integer", "null"] }
        codigo: { type: ["integer", "null"] }
        razaoSocial: { type: string }
        cnpj: { type: ["string", "null"] }
        cnaePrincipal: { type: ["string", "null"] }
        regime: { $ref: "#/components/schemas/RegimeTributario" }
        inscricaoEstadual: { type: ["string", "null"] }
        inscricaoMunicipal: { type: ["string", "null"] }
        formaEnvio: { type: ["string", "null"] }
        procuracao: { type: ["string", "null"] }
        procuracaoVencimento: { type: ["string", "null"] }
        socioNome: { type: ["string", "null"] }
        socioCpf: { type: ["string", "null"] }
        senhaGov: { type: ["string", "null"] }
        senhaNfse: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        valorHonorario: { type: ["string", "null"] }
        diaVencimentoHonorario: { type: ["integer", "null"] }
        contatoNome: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        ativo: { type: boolean }
        obrigacoes:
          type: array
          items: { type: integer }

    RegimeTributario:
      type: ["string", "null"]
      enum: [simples_nacional, mei, lucro_presumido, lucro_real, null]

    # Edição célula-a-célula na tela de Dados cadastrais: todos os campos são
    # opcionais e só o que vier no body é gravado (não mexe nas obrigações).
    ClientePatch:
      type: object
      properties:
        codigo: { type: ["integer", "null"] }
        razaoSocial: { type: string }
        cnpj: { type: ["string", "null"] }
        cnaePrincipal: { type: ["string", "null"] }
        regime: { $ref: "#/components/schemas/RegimeTributario" }
        inscricaoEstadual: { type: ["string", "null"] }
        inscricaoMunicipal: { type: ["string", "null"] }
        formaEnvio: { type: ["string", "null"] }
        procuracao: { type: ["string", "null"] }
        procuracaoVencimento: { type: ["string", "null"] }
        socioNome: { type: ["string", "null"] }
        socioCpf: { type: ["string", "null"] }
        senhaGov: { type: ["string", "null"] }
        senhaNfse: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        valorHonorario: { type: ["string", "null"] }
        diaVencimentoHonorario: { type: ["integer", "null"] }
        contatoNome: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        ativo: { type: boolean }

    Periodicidade:
      type: string
      enum: [mensal, bimestral, trimestral, semestral, anual]

    # Variante sem null, para usar dentro de listas.
    RegimeValor:
      type: string
      enum: [simples_nacional, mei, lucro_presumido, lucro_real]

    TipoObrigacao:
      type: object
      required: [id, nome, ordem, offsetMes, periodicidade, ativo]
      properties:
        id: { type: integer }
        nome: { type: string }
        ordem: { type: integer }
        diaVencimento: { type: ["integer", "null"] }
        offsetMes: { type: integer }
        periodicidade: { $ref: "#/components/schemas/Periodicidade" }
        mesReferencia: { type: ["integer", "null"] }
        # Lista vazia ou ausente = a obrigação vale para todos os regimes.
        regimes:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/RegimeValor" }
        ativo: { type: boolean }

    TipoObrigacaoInput:
      type: object
      required: [nome]
      properties:
        id: { type: ["integer", "null"] }
        nome: { type: string }
        ordem: { type: integer }
        diaVencimento: { type: ["integer", "null"] }
        offsetMes: { type: integer }
        periodicidade: { $ref: "#/components/schemas/Periodicidade" }
        mesReferencia: { type: ["integer", "null"] }
        # Lista vazia ou ausente = a obrigação vale para todos os regimes.
        regimes:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/RegimeValor" }

    StatusDebito:
      type: string
      enum: [em_aberto, parcelado, pago]

    Debito:
      type: object
      required: [id, clienteId, clienteNome, rotulo, status]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string }
        competenciaRef: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"] }
        valor: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusDebito" }
        observacao: { type: ["string", "null"] }

    DebitoInput:
      type: object
      required: [clienteId, rotulo]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: integer }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string }
        competenciaRef: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"] }
        valor: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusDebito" }
        observacao: { type: ["string", "null"] }

    DebitoPatch:
      type: object
      properties:
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string }
        competenciaRef: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"] }
        valor: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusDebito" }
        observacao: { type: ["string", "null"] }

    Credencial:
      type: object
      required: [id, clienteId, clienteNome, rotulo]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string }
        login: { type: ["string", "null"] }
        senha: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    CredencialInput:
      type: object
      required: [clienteId, rotulo]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: integer }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string }
        login: { type: ["string", "null"] }
        senha: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    CredencialPatch:
      type: object
      properties:
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string }
        login: { type: ["string", "null"] }
        senha: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    CategoriaProcesso:
      type: string
      enum: [processo, pedido]

    StatusProcesso:
      type: string
      enum: [aberto, em_andamento, concluido, cancelado]

    Processo:
      type: object
      required: [id, clienteId, clienteNome, tipo, status, totalEtapas, etapasFeitas]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipo: { type: string }
        categoria: { $ref: "#/components/schemas/CategoriaProcesso" }
        titulo: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusProcesso" }
        orgao: { type: ["string", "null"] }
        protocolo: { type: ["string", "null"] }
        abertoEm: { type: ["string", "null"] }
        prazo: { type: ["string", "null"] }
        concluidoEm: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        totalEtapas: { type: integer }
        etapasFeitas: { type: integer }

    ProcessoComEtapas:
      allOf:
        - $ref: "#/components/schemas/Processo"
        - type: object
          required: [etapas]
          properties:
            etapas:
              type: array
              items:
                $ref: "#/components/schemas/ProcessoEtapa"

    ProcessoInput:
      type: object
      required: [clienteId, tipo]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: integer }
        tipo: { type: string }
        categoria: { $ref: "#/components/schemas/CategoriaProcesso" }
        titulo: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusProcesso" }
        orgao: { type: ["string", "null"] }
        protocolo: { type: ["string", "null"] }
        abertoEm: { type: ["string", "null"] }
        prazo: { type: ["string", "null"] }
        concluidoEm: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    ProcessoEtapa:
      type: object
      required: [id, processoId, descricao, feito, ordem]
      properties:
        id: { type: integer }
        processoId: { type: integer }
        descricao: { type: string }
        feito: { type: boolean }
        ordem: { type: integer }
        concluidoEm: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    EtapaInput:
      type: object
      required: [descricao]
      properties:
        descricao: { type: string }
        observacao: { type: ["string", "null"] }

    EtapaPatch:
      type: object
      properties:
        descricao: { type: string }
        feito: { type: boolean }
        ordem: { type: integer }
        observacao: { type: ["string", "null"] }

    Competencia:
      type: object
      required: [id, ano, mes]
      properties:
        id: { type: integer }
        ano: { type: integer }
        mes: { type: integer }
        rotulo: { type: ["string", "null"] }

    CompetenciaComResumo:
      type: object
      required: [id, ano, mes, resumo]
      properties:
        id: { type: integer }
        ano: { type: integer }
        mes: { type: integer }
        rotulo: { type: ["string", "null"] }
        resumo:
          $ref: "#/components/schemas/Resumo"

    AbrirCompetenciaInput:
      type: object
      required: [ano, mes]
      properties:
        ano: { type: integer }
        mes: { type: integer }
        # Para meses anteriores ao início do uso do sistema: gera só os
        # honorários (pagamentos), sem o checklist de obrigações daquele mês.
        somenteHonorarios: { type: boolean }

    ChecklistItem:
      type: object
      required: [id, status, clienteId, cliente, tipoObrigacaoId, obrigacao, ordem]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pendente, emitido, enviado, nao_aplica]
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"] }
        cliente: { type: string }
        vencimento: { type: ["string", "null"] }
        tipoObrigacaoId: { type: integer }
        obrigacao: { type: string }
        ordem: { type: integer }

    StatusChecklistInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pendente, emitido, enviado, nao_aplica]

    VencimentoInput:
      type: object
      properties:
        vencimento: { type: ["string", "null"] }

    Pagamento:
      type: object
      required: [id, status, clienteId, cliente]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pendente, pago, isento]
        valor: { type: ["string", "null"] }
        dataPagamento: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"] }
        forma: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"] }
        cliente: { type: string }

    PagamentoInput:
      type: object
      properties:
        status:
          type: string
          enum: [pendente, pago, isento]
        valor: { type: ["string", "null"] }
        dataPagamento: { type: ["string", "null"] }
        forma: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    ObrigacaoAtrasada:
      type: object
      required: [id, competenciaId, ano, mes, diasAtraso, clienteId, cliente, obrigacao]
      properties:
        id: { type: integer }
        competenciaId: { type: integer }
        ano: { type: integer }
        mes: { type: integer }
        vencimento: { type: ["string", "null"] }
        diasAtraso: { type: integer }
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"] }
        cliente: { type: string }
        obrigacao: { type: string }

    Inadimplente:
      type: object
      required: [id, competenciaId, ano, mes, diasAtraso, clienteId, cliente]
      properties:
        id: { type: integer }
        competenciaId: { type: integer }
        ano: { type: integer }
        mes: { type: integer }
        valor: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"] }
        diasAtraso: { type: integer }
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"] }
        cliente: { type: string }
        whatsapp: { type: ["string", "null"] }
        cobradoEm: { type: ["string", "null"] }

    Pendencias:
      type: object
      required: [obrigacoes, inadimplentes]
      properties:
        obrigacoes:
          type: array
          items:
            $ref: "#/components/schemas/ObrigacaoAtrasada"
        inadimplentes:
          type: array
          items:
            $ref: "#/components/schemas/Inadimplente"

    CobrancaInput:
      type: object
      required: [pagamentoId]
      properties:
        pagamentoId: { type: integer }

    Configuracao:
      type: object
      required: [chave, valor]
      properties:
        chave: { type: string }
        valor: { type: string }

    ConfiguracaoInput:
      type: object
      required: [valor]
      properties:
        valor: { type: string }

    # Filtro dos registros que existem para o escritório e para os clientes:
    # `escritorio` = só os sem cliente, `clientes` = só os com cliente.
    EscopoRegistro:
      type: string
      enum: [todos, escritorio, clientes]

    Perfil:
      type: object
      required: [id, nome]
      properties:
        id: { type: integer }
        nome: { type: string }
        cnpj: { type: ["string", "null"] }
        responsavel: { type: ["string", "null"] }
        crc: { type: ["string", "null"] }
        telefone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }

    PerfilInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: ["string", "null"] }
        responsavel: { type: ["string", "null"] }
        crc: { type: ["string", "null"] }
        telefone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }

    Despesa:
      type: object
      required: [id, data, categoria, descricao, valor, pago]
      properties:
        id: { type: integer }
        clienteId: { type: ["integer", "null"] }
        clienteNome: { type: ["string", "null"] }
        data: { type: string }
        categoria: { type: string }
        descricao: { type: string }
        valor: { type: string }
        vencimento: { type: ["string", "null"] }
        formaPagamento: { type: ["string", "null"] }
        pago: { type: boolean }
        observacao: { type: ["string", "null"] }

    DespesaInput:
      type: object
      required: [data, categoria, descricao, valor]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: ["integer", "null"] }
        data: { type: string }
        categoria: { type: string, minLength: 1 }
        descricao: { type: string, minLength: 1 }
        valor: { type: string }
        vencimento: { type: ["string", "null"] }
        formaPagamento: { type: ["string", "null"] }
        pago: { type: boolean }
        observacao: { type: ["string", "null"] }

    DespesaPatch:
      type: object
      properties:
        clienteId: { type: ["integer", "null"] }
        data: { type: string }
        categoria: { type: string }
        descricao: { type: string }
        valor: { type: string }
        vencimento: { type: ["string", "null"] }
        formaPagamento: { type: ["string", "null"] }
        pago: { type: boolean }
        observacao: { type: ["string", "null"] }

    SituacaoFuncionario:
      type: string
      enum: [ativo, ferias, afastado, demitido]

    Funcionario:
      type: object
      required: [id, nome, situacao]
      properties:
        id: { type: integer }
        clienteId: { type: ["integer", "null"] }
        clienteNome: { type: ["string", "null"] }
        nome: { type: string }
        cpf: { type: ["string", "null"] }
        rg: { type: ["string", "null"] }
        pis: { type: ["string", "null"] }
        ctps: { type: ["string", "null"] }
        nascimento: { type: ["string", "null"] }
        cargo: { type: ["string", "null"] }
