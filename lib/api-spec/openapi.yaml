openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ContaFácil API — gestão contábil
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clientes
    description: Gestão de clientes
  - name: tipos
    description: Tipos de obrigação
  - name: competencias
    description: Competências mensais
  - name: checklist
    description: Itens do checklist
  - name: pagamentos
    description: Pagamentos de honorários
  - name: pendencias
    description: Pendências e inadimplências
  - name: configuracoes
    description: Configurações do sistema
  - name: painel
    description: Painel de resumo
  - name: processos
    description: Processos avulsos por cliente (troca de titularidade, alteração de endereço…)
  - name: credenciais
    description: Senhas por sistema/obrigação de cada cliente
  - name: debitos
    description: Guias do cliente em atraso com o fisco
  - name: auth
    description: Login e sessão do escritório
  - name: usuarios
    description: Usuários do escritório e seus papéis
  - name: arquivos
    description: Arquivos anexados (guias, comprovantes, documentos)
  - name: avisos
    description: Avisos enviados ao cliente (e-mail, WhatsApp, portal)
  - name: jobs
    description: Fila de tarefas em segundo plano
  - name: produtividade
    description: Produtividade por colaborador e atrasos por cliente
  - name: portal
    description: Portal do cliente (sessão própria, só os dados dele)
  - name: solicitacoes
    description: Documentos e informações pedidos ao cliente
  - name: webhooks
    description: Retornos de provedores externos

paths:
  /auth/entrar:
    post:
      operationId: entrar
      tags: [auth]
      summary: Abre uma sessão com login e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciais"
      responses:
        "200":
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoAtual"
        "401":
          $ref: "#/components/responses/Erro"

  /auth/sair:
    post:
      operationId: sair
      tags: [auth]
      summary: Encerra a sessão atual
      responses:
        "204":
          description: Sessão encerrada

  /auth/eu:
    get:
      operationId: getSessaoAtual
      tags: [auth]
      summary: Quem está logado e em qual conta
      responses:
        "200":
          description: Sessão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoAtual"
        "401":
          $ref: "#/components/responses/Erro"

  /auth/trocar-senha:
    post:
      operationId: trocarSenha
      tags: [auth]
      summary: Troca a própria senha (encerra as outras sessões do usuário)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrocarSenhaInput"
      responses:
        "204":
          description: Senha trocada
        "400":
          $ref: "#/components/responses/Erro"

  /auth/sair-de-todos:
    post:
      operationId: sairDeTodos
      tags: [auth]
      summary: Encerra todas as sessões do usuário, inclusive a atual
      responses:
        "204":
          description: Sessões encerradas

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /painel:
    get:
      operationId: getPainel
      tags: [painel]
      summary: Resumo do painel principal
      responses:
        "200":
          description: Dados do painel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Painel"

  /clientes:
    get:
      operationId: listarClientes
      tags: [clientes]
      summary: Lista todos os clientes
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      operationId: criarCliente
      tags: [clientes]
      summary: Cria ou atualiza um cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteInput"
      responses:
        "200":
          description: Cliente salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}:
    patch:
      operationId: atualizarCliente
      tags: [clientes]
      summary: Atualiza campos avulsos de um cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientePatch"
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
    delete:
      operationId: removerCliente
      tags: [clientes]
      summary: Apaga um cliente sem histórico (só admin). Com competência gerada, use inativar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removido
        "409":
          $ref: "#/components/responses/Erro"

  /clientes/{id}/inativar:
    post:
      operationId: inativarCliente
      tags: [clientes]
      summary: Inativa o cliente (sai das competências novas; o histórico fica)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Cliente inativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}/reativar:
    post:
      operationId: reativarCliente
      tags: [clientes]
      summary: Reativa um cliente inativado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Cliente reativado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"

  /clientes/{id}/segredos:
    get:
      operationId: getSegredosCliente
      tags: [clientes]
      summary: Revela as senhas gov.br e NFS-e do cliente (fica registrado na auditoria)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Senhas em claro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegredosCliente"
        "403":
          $ref: "#/components/responses/Erro"
        "404":
          $ref: "#/components/responses/Erro"

  /tipos:
    get:
      operationId: listarTipos
      tags: [tipos]
      summary: Lista tipos de obrigação
      responses:
        "200":
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoObrigacao"
    post:
      operationId: salvarTipo
      tags: [tipos]
      summary: Cria ou atualiza tipo de obrigação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipoObrigacaoInput"
      responses:
        "200":
          description: Tipo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TipoObrigacao"

  /tipos/vincular-automaticos:
    post:
      operationId: vincularAutomaticas
      tags: [tipos]
      summary: Vincula a cada cliente ativo com regime as obrigações automáticas do regime dele (só acrescenta)
      responses:
        "200":
          description: Quantos vínculos foram criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoVinculo"

  /tipos/{id}:
    delete:
      operationId: removerTipo
      tags: [tipos]
      summary: Remove tipo de obrigação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removido

  /debitos:
    get:
      operationId: listarDebitos
      tags: [debitos]
      summary: Lista guias em atraso
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusDebito"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de débitos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debito"
    post:
      operationId: salvarDebito
      tags: [debitos]
      summary: Cria ou atualiza uma guia em atraso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitoInput"
      responses:
        "200":
          description: Débito salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debito"

  /debitos/{id}:
    patch:
      operationId: atualizarDebito
      tags: [debitos]
      summary: Atualiza campos avulsos de uma guia em atraso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitoPatch"
      responses:
        "200":
          description: Débito atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debito"
    delete:
      operationId: removerDebito
      tags: [debitos]
      summary: Remove uma guia em atraso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removida

  /credenciais:
    get:
      operationId: listarCredenciais
      tags: [credenciais]
      summary: Lista senhas de todos os clientes
      responses:
        "200":
          description: Lista de credenciais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credencial"
    post:
      operationId: salvarCredencial
      tags: [credenciais]
      summary: Cria ou atualiza uma credencial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialInput"
      responses:
        "200":
          description: Credencial salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credencial"

  /credenciais/{id}:
    patch:
      operationId: atualizarCredencial
      tags: [credenciais]
      summary: Atualiza campos avulsos de uma credencial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialPatch"
      responses:
        "200":
          description: Credencial atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credencial"
    delete:
      operationId: removerCredencial
      tags: [credenciais]
      summary: Remove uma credencial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removida

  /credenciais/{id}/senha:
    get:
      operationId: getSenhaCredencial
      tags: [credenciais]
      summary: Revela a senha de um acesso (fica registrado na auditoria)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Senha em claro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenhaRevelada"
        "403":
          $ref: "#/components/responses/Erro"
        "404":
          $ref: "#/components/responses/Erro"

  /processos:
    get:
      operationId: listarProcessos
      tags: [processos]
      summary: Lista processos (opcionalmente filtrados)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusProcesso"
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
        - name: categoria
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoriaProcesso"
      responses:
        "200":
          description: Lista de processos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Processo"
    post:
      operationId: salvarProcesso
      tags: [processos]
      summary: Cria ou atualiza um processo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessoInput"
      responses:
        "200":
          description: Processo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Processo"

  /processos/{id}:
    get:
      operationId: getProcesso
      tags: [processos]
      summary: Obtém um processo com suas etapas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Processo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoComEtapas"
        "404":
          $ref: "#/components/responses/Erro"
    delete:
      operationId: removerProcesso
      tags: [processos]
      summary: Remove um processo e suas etapas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removido

  /processos/{id}/etapas:
    post:
      operationId: adicionarEtapa
      tags: [processos]
      summary: Adiciona uma etapa ao checklist do processo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtapaInput"
      responses:
        "200":
          description: Etapa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoEtapa"

  /etapas/{id}:
    patch:
      operationId: atualizarEtapa
      tags: [processos]
      summary: Atualiza uma etapa (marcar feito, editar texto)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtapaPatch"
      responses:
        "200":
          description: Etapa atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessoEtapa"
    delete:
      operationId: removerEtapa
      tags: [processos]
      summary: Remove uma etapa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removida

  /competencias:
    get:
      operationId: listarCompetencias
      tags: [competencias]
      summary: Lista competências com resumo
      responses:
        "200":
          description: Lista de competências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetenciaComResumo"
    post:
      operationId: abrirCompetencia
      tags: [competencias]
      summary: Abre uma nova competência (gera checklist e pagamentos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbrirCompetenciaInput"
      responses:
        "200":
          description: Competência criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competencia"

  /competencias/{id}:
    get:
      operationId: getCompetencia
      tags: [competencias]
      summary: Obtém uma competência com resumo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Competência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetenciaComResumo"
        "404":
          $ref: "#/components/responses/Erro"
    delete:
      operationId: removerCompetencia
      tags: [competencias]
      summary: Remove competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removida

  /competencias/{id}/sincronizar:
    post:
      operationId: sincronizarCompetencia
      tags: [competencias]
      summary: Acrescenta ao mês os clientes e obrigações incluídos depois da abertura
      description: Idempotente — só cria o que falta; itens e pagamentos existentes não são tocados.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: O que foi acrescentado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoSincronizacao"
        "404":
          $ref: "#/components/responses/Erro"

  /competencias/{id}/checklist:
    get:
      operationId: listarChecklist
      tags: [checklist]
      summary: Lista itens do checklist da competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Itens do checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"

  /competencias/{id}/pagamentos:
    get:
      operationId: listarPagamentos
      tags: [pagamentos]
      summary: Lista pagamentos da competência
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pagamento"

  /checklist/{id}/status:
    patch:
      operationId: atualizarStatusChecklist
      tags: [checklist]
      summary: Atualiza status de um item do checklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChecklistInput"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /checklist/{id}/vencimento:
    patch:
      operationId: atualizarVencimentoChecklist
      tags: [checklist]
      summary: Atualiza vencimento de um item do checklist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VencimentoInput"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /checklist/{id}/enviar:
    post:
      operationId: enviarGuia
      tags: [checklist]
      summary: Envia a guia anexada ao cliente com protocolo e marca o item como enviado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnviarGuiaInput"
      responses:
        "200":
          description: Guia enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvioGuia"
        "400":
          $ref: "#/components/responses/Erro"

  /checklist/{id}/protocolos:
    get:
      operationId: listarProtocolosItem
      tags: [checklist]
      summary: Protocolos de envio de um item (quem enviou, quando, se foi visualizado)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Protocolos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Protocolo"

  /protocolo/{token}:
    get:
      operationId: abrirProtocolo
      tags: [arquivos]
      summary: Link público da guia enviada; registra a visualização e entrega o arquivo
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 20
            maxLength: 100
      responses:
        "200":
          description: O arquivo
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Redireciona para a URL assinada do armazenamento
        "404":
          $ref: "#/components/responses/Erro"
        "410":
          $ref: "#/components/responses/Erro"

  /produtividade:
    get:
      operationId: getProdutividade
      tags: [produtividade]
      summary: Guias enviadas por colaborador e obrigações atrasadas por cliente
      parameters:
        - name: meses
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
      responses:
        "200":
          description: Produtividade do período
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produtividade"

  /pagamentos/{id}:
    patch:
      operationId: atualizarPagamento
      tags: [pagamentos]
      summary: Atualiza um pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoInput"
      responses:
        "200":
          description: Pagamento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"

  /pendencias:
    get:
      operationId: listarPendencias
      tags: [pendencias]
      summary: Lista obrigações e pagamentos em atraso
      responses:
        "200":
          description: Pendências
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pendencias"

  /pendencias/obrigacoes/{id}/feito:
    patch:
      operationId: marcarObrigacaoFeita
      tags: [pendencias]
      summary: Marca obrigação pendente como enviada (fim do ciclo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Marcado

