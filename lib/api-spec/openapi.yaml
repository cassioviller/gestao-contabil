                items:
                  $ref: "#/components/schemas/Solicitacao"

  /portal/solicitacoes/{id}/arquivos:
    post:
      operationId: criarArquivoPortal
      tags: [portal]
      summary: Registra um arquivo enviado pelo cliente em resposta a uma solicitação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalArquivoInput"
      responses:
        "200":
          description: Registro criado; o conteúdo ainda precisa subir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArquivoCriado"

  /portal/solicitacoes/{id}/responder:
    post:
      operationId: responderSolicitacaoPortal
      tags: [portal]
      summary: Resposta em texto do cliente a uma solicitação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespostaSolicitacaoInput"
      responses:
        "200":
          description: Solicitação respondida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"

  /portal/pedidos:
    get:
      operationId: listarPortalPedidos
      tags: [portal]
      summary: Pedidos do cliente ao escritório (categoria pedido)
      responses:
        "200":
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Processo"
    post:
      operationId: criarPortalPedido
      tags: [portal]
      summary: O cliente abre um pedido ao escritório
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPedidoInput"
      responses:
        "200":
          description: Pedido aberto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Processo"

  /solicitacoes:
    get:
      operationId: listarSolicitacoes
      tags: [solicitacoes]
      summary: Solicitações feitas aos clientes
      parameters:
        - name: clienteId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatusSolicitacao"
      responses:
        "200":
          description: Solicitações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Solicitacao"
    post:
      operationId: criarSolicitacao
      tags: [solicitacoes]
      summary: Pede um documento ou informação ao cliente (avisa por e-mail se houver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoInput"
      responses:
        "200":
          description: Solicitação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"

  /solicitacoes/{id}:
    patch:
      operationId: atualizarSolicitacao
      tags: [solicitacoes]
      summary: Altera situação, descrição ou prazo de uma solicitação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoPatch"
      responses:
        "200":
          description: Solicitação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"

  /clientes/{id}/link-portal:
    post:
      operationId: gerarLinkPortal
      tags: [clientes]
      summary: Gera um link de acesso ao portal para entregar ao cliente por outro meio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Link válido por 30 minutos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPortal"

  /pagamentos/{id}/cobrar:
    post:
      operationId: cobrarPagamento
      tags: [pagamentos]
      summary: Gera a cobrança no provedor (link e Pix) para o honorário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Cobrança criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"
        "400":
          $ref: "#/components/responses/Erro"
        "503":
          $ref: "#/components/responses/Erro"

  /webhooks/asaas:
    post:
      operationId: webhookAsaas
      tags: [webhooks]
      summary: Retorno do Asaas (baixa automática do honorário)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoAsaas"
      responses:
        "200":
          description: Evento recebido
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  duplicado: { type: boolean }
        "401":
          $ref: "#/components/responses/Erro"


components:
  securitySchemes:
    tokenJobs:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer ${TOKEN_JOBS}`"
  responses:
    Erro:
      description: Erro tratado pela API
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
  schemas:
    # Toda resposta de erro tem este formato (middlewares/error-handler.ts);
    # `codigo` é estável para a tela decidir o que fazer.
    Erro:
      type: object
      required: [error, codigo]
      properties:
        error: { type: string }
        codigo: { type: string }
        details: {}
        issues:
          type: array
          items: { type: object, additionalProperties: true }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Credenciais:
      type: object
      required: [login, senha]
      properties:
        login:
          type: string
          minLength: 1
        senha:
          type: string
          minLength: 1

    # Quem está logado. `conta` é o escritório dono dos dados — todo o resto da
    # API responde só o que pertence a ela.
    EntidadeArquivo:
      type: string
      enum: [checklist_item, processo, pagamento, cliente, solicitacao]

    Arquivo:
      type: object
      required: [id, clienteId, entidade, entidadeId, nome, mime, tamanho, sha256, origem, confirmado, criadoEm]
      properties:
        id: { type: integer }
        clienteId: { type: ["integer", "null"] }
        entidade: { $ref: "#/components/schemas/EntidadeArquivo" }
        entidadeId: { type: integer }
        nome: { type: string, minLength: 1, maxLength: 200 }
        mime: { type: string }
        tamanho: { type: integer }
        sha256: { type: ["string", "null"] }
        origem: { type: string }
        confirmado: { type: boolean }
        criadoEm: { type: string, format: date-time }

    ArquivoInput:
      type: object
      required: [entidade, entidadeId, nome, mime, tamanho]
      properties:
        entidade: { $ref: "#/components/schemas/EntidadeArquivo" }
        entidadeId: { type: integer, minimum: 1 }
        nome: { type: string, minLength: 1, maxLength: 200 }
        mime: { type: string, minLength: 1 }
        tamanho: { type: integer, minimum: 1 }

    # Para onde o navegador sobe o conteúdo. `null` = passa pela API
    # (`PUT /arquivos/{id}/conteudo`), caso do armazenamento local.
    UploadAssinado:
      type: ["object", "null"]
      required: [url, metodo, expiraEm]
      properties:
        url: { type: string }
        metodo: { type: string, enum: [PUT] }
        cabecalhos:
          type: object
          additionalProperties: { type: string }
        expiraEm: { type: string, format: date-time }

    ArquivoCriado:
      type: object
      required: [arquivo, upload, urlConteudo]
      properties:
        arquivo: { $ref: "#/components/schemas/Arquivo" }
        upload: { $ref: "#/components/schemas/UploadAssinado" }
        # Rota da API para subir/baixar quando `upload` é nulo.
        urlConteudo: { type: string }

    UrlDownload:
      type: object
      required: [url, expiraEm]
      properties:
        url: { type: string }
        expiraEm: { type: ["string", "null"], format: date-time }

    CanalAviso:
      type: string
      enum: [email, whatsapp, portal]

    StatusAviso:
      type: string
      enum: [pendente, enviado, entregue, lido, falhou]

    Aviso:
      type: object
      required: [id, clienteId, canal, destino, modelo, assunto, corpo, status, tentativas, erro, enviadoEm, criadoEm]
      properties:
        id: { type: integer }
        clienteId: { type: ["integer", "null"] }
        clienteNome: { type: ["string", "null"] }
        canal: { $ref: "#/components/schemas/CanalAviso" }
        destino: { type: ["string", "null"] }
        modelo: { type: string }
        assunto: { type: ["string", "null"] }
        corpo: { type: string }
        status: { $ref: "#/components/schemas/StatusAviso" }
        tentativas: { type: integer }
        provedorId: { type: ["string", "null"] }
        erro: { type: ["string", "null"] }
        referenciaEntidade: { type: ["string", "null"] }
        referenciaId: { type: ["integer", "null"] }
        enviadoEm: { type: ["string", "null"], format: date-time }
        criadoEm: { type: string, format: date-time }

    AvisoInput:
      type: object
      required: [clienteId, canal, corpo]
      properties:
        clienteId: { type: integer, minimum: 1 }
        canal: { $ref: "#/components/schemas/CanalAviso" }
        assunto: { type: ["string", "null"], maxLength: 200 }
        corpo: { type: string, minLength: 1, maxLength: 5000 }

    StatusJob:
      type: string
      enum: [pendente, executando, concluido, falhou]

    Job:
      type: object
      required: [id, tipo, chave, status, tentativas, maxTentativas, executarEm, iniciadoEm, concluidoEm, erro, criadoEm]
      properties:
        id: { type: integer }
        contaId: { type: ["integer", "null"] }
        tipo: { type: string }
        chave: { type: ["string", "null"] }
        dados: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/StatusJob" }
        tentativas: { type: integer }
        maxTentativas: { type: integer }
        executarEm: { type: string, format: date-time }
        iniciadoEm: { type: ["string", "null"], format: date-time }
        concluidoEm: { type: ["string", "null"], format: date-time }
        erro: { type: ["string", "null"] }
        criadoEm: { type: string, format: date-time }

    ExecutarJobsInput:
      type: object
      properties:
        limiteMs: { type: integer, minimum: 1000, maximum: 300000 }
        # Tipos recorrentes para rodar agora, fora da chave diária (ex.: depois
        # de corrigir um cadastro): `vencimentos-d3`, `honorarios-vencidos`, `limpeza`.
        agora:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 60 }

    ResultadoJobs:
      type: object
      required: [executados, falhas, restantes]
      properties:
        executados: { type: integer }
        falhas: { type: integer }
        restantes: { type: integer }

    PortalEntradaInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 200 }

    PortalSessao:
      type: object
      required: [clienteId, razaoSocial, escritorio, email, cnpj]
      properties:
        clienteId: { type: integer }
        razaoSocial: { type: string }
        escritorio: { type: string }
        email: { type: string }
        cnpj: { type: ["string", "null"] }

    PortalGuia:
      type: object
      required: [id, obrigacao, ano, mes, vencimento, status, arquivos, enviadoEm, cienteEm]
      properties:
        id: { type: integer }
        obrigacao: { type: string }
        ano: { type: integer }
        mes: { type: integer }
        vencimento: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [pendente, emitido, enviado, nao_aplica]
        arquivos:
          type: array
          items:
            type: object
            required: [id, nome, tamanho]
            properties:
              id: { type: integer }
              nome: { type: string }
              tamanho: { type: integer }
        enviadoEm: { type: ["string", "null"], format: date-time }
        cienteEm: { type: ["string", "null"], format: date-time }

    PortalHonorario:
      type: object
      required: [id, ano, mes, valor, vencimento, status, dataPagamento, linkPagamento, qrPix]
      properties:
        id: { type: integer }
        ano: { type: integer }
        mes: { type: integer }
        valor: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"], format: date }
        status:
          type: string
          enum: [pendente, pago, isento]
        dataPagamento: { type: ["string", "null"], format: date }
        linkPagamento: { type: ["string", "null"] }
        qrPix: { type: ["string", "null"] }

    PortalArquivoInput:
      type: object
      required: [nome, mime, tamanho]
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        mime: { type: string, minLength: 1 }
        tamanho: { type: integer, minimum: 1 }

    RespostaSolicitacaoInput:
      type: object
      required: [resposta]
      properties:
        resposta: { type: string, minLength: 1, maxLength: 5000 }

    PortalPedidoInput:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, minLength: 1, maxLength: 200 }
        observacao: { type: ["string", "null"], maxLength: 5000 }

    StatusSolicitacao:
      type: string
      enum: [aberta, respondida, concluida]

    Solicitacao:
      type: object
      required: [id, clienteId, clienteNome, tipo, descricao, prazo, status, origem, resposta, respondidaEm, arquivos, criadoEm]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipo: { type: string }
        descricao: { type: string }
        prazo: { type: ["string", "null"], format: date }
        status: { $ref: "#/components/schemas/StatusSolicitacao" }
        origem: { type: string }
        resposta: { type: ["string", "null"] }
        respondidaEm: { type: ["string", "null"], format: date-time }
        arquivos: { type: integer }
        criadoEm: { type: string, format: date-time }

    SolicitacaoInput:
      type: object
      required: [clienteId, descricao]
      properties:
        clienteId: { type: integer, minimum: 1 }
        tipo: { type: string, enum: [documento, informacao] }
        descricao: { type: string, minLength: 1, maxLength: 2000 }
        prazo: { type: ["string", "null"], format: date }

    SolicitacaoPatch:
      type: object
      properties:
        status: { $ref: "#/components/schemas/StatusSolicitacao" }
        descricao: { type: string, minLength: 1, maxLength: 2000 }
        prazo: { type: ["string", "null"], format: date }

    # Corpo do webhook do Asaas, guardado como veio (só `event` e `payment.id` importam).
    EventoAsaas:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        event: { type: string }

    LinkPortal:
      type: object
      required: [link, expiraEm]
      properties:
        link: { type: string }
        expiraEm: { type: string, format: date-time }

    SessaoAtual:
      type: object
      required: [contaId, conta, login, nome, usuarioId, papel]
      properties:
        contaId: { type: integer }
        conta: { type: string }
        usuarioId: { type: integer }
        login: { type: string }
        nome: { type: ["string", "null"] }
        papel: { $ref: "#/components/schemas/Papel" }

    # admin: gerencia usuários e tudo o mais; contador: opera o escritório e
    # revela senhas; auxiliar: opera, mas não revela senhas nem gerencia gente.
    Papel:
      type: string
      enum: [admin, contador, auxiliar]

    TrocarSenhaInput:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, minLength: 1 }
        novaSenha: { type: string, minLength: 8, maxLength: 200 }

    SegredosCliente:
      type: object
      required: [senhaGov, senhaNfse]
      properties:
        senhaGov: { type: ["string", "null"] }
        senhaNfse: { type: ["string", "null"] }

    SenhaRevelada:
      type: object
      required: [senha]
      properties:
        senha: { type: ["string", "null"] }

    Usuario:
      type: object
      required: [id, login, nome, email, papel, ativo, ultimoAcessoEm, criadoEm]
      properties:
        id: { type: integer }
        login: { type: string }
        nome: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        papel: { $ref: "#/components/schemas/Papel" }
        ativo: { type: boolean }
        ultimoAcessoEm: { type: ["string", "null"], format: date-time }
        criadoEm: { type: string, format: date-time }

    UsuarioInput:
      type: object
      required: [login, papel, senha]
      properties:
        login: { type: string, minLength: 2, maxLength: 60 }
        nome: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        papel: { $ref: "#/components/schemas/Papel" }
        senha: { type: string, minLength: 8, maxLength: 200 }

    UsuarioPatch:
      type: object
      properties:
        nome: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        papel: { $ref: "#/components/schemas/Papel" }
        ativo: { type: boolean }

    RedefinirSenhaInput:
      type: object
      required: [novaSenha]
      properties:
        novaSenha: { type: string, minLength: 8, maxLength: 200 }

    Resumo:
      type: object
      required: [obrigacoes, pagamentos]
      properties:
        obrigacoes:
          type: object
          required: [total, feitos, emitidos, pendentes]
          properties:
            total: { type: integer }
            # `feitos` = enviados ao cliente, o fim do ciclo.
            feitos: { type: integer }
            emitidos: { type: integer }
            pendentes: { type: integer }
        pagamentos:
          type: object
          required: [total, pagos, pendentes, recebido, aReceber]
          properties:
            total: { type: integer }
            pagos: { type: integer }
            pendentes: { type: integer }
            recebido: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
            aReceber: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }

    Painel:
      type: object
      required: [clientesAtivos, competenciaAtual, alertas]
      properties:
        clientesAtivos:
          type: integer
        alertas:
          $ref: "#/components/schemas/Alertas"
        competenciaAtual:
          type: ["object", "null"]
          properties:
            id: { type: integer }
            ano: { type: integer, minimum: 2000, maximum: 2100 }
            mes: { type: integer, minimum: 1, maximum: 12 }
            resumo:
              $ref: "#/components/schemas/Resumo"

    Cliente:
      type: object
      required: [id, razaoSocial, ativo, obrigacoes, temSenhaGov, temSenhaNfse]
      properties:
        id: { type: integer }
        codigo: { type: ["integer", "null"], minimum: 0 }
        razaoSocial: { type: string, minLength: 1, maxLength: 200 }
        cnpj: { type: ["string", "null"] }
        cnaePrincipal: { type: ["string", "null"] }
        regime: { $ref: "#/components/schemas/RegimeTributario" }
        inscricaoEstadual: { type: ["string", "null"] }
        inscricaoMunicipal: { type: ["string", "null"] }
        formaEnvio: { type: ["string", "null"] }
        procuracao: { type: ["string", "null"] }
        procuracaoVencimento: { type: ["string", "null"], format: date }
        socioNome: { type: ["string", "null"] }
        socioCpf: { type: ["string", "null"] }
        # As senhas nunca saem na listagem: só por /clientes/{id}/segredos, com auditoria.
        temSenhaGov: { type: boolean }
        temSenhaNfse: { type: boolean }
        observacao: { type: ["string", "null"] }
        valorHonorario: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        diaVencimentoHonorario: { type: ["integer", "null"], minimum: 1, maximum: 31 }
        contatoNome: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        ativo: { type: boolean }
        inativadoEm: { type: ["string", "null"], format: date-time }
        obrigacoes:
          type: array
          items: { type: integer }

    ClienteInput:
      type: object
      required: [razaoSocial]
      properties:
        id: { type: ["integer", "null"] }
        codigo: { type: ["integer", "null"], minimum: 0 }
        razaoSocial: { type: string, minLength: 1, maxLength: 200 }
        cnpj: { type: ["string", "null"] }
        cnaePrincipal: { type: ["string", "null"] }
        regime: { $ref: "#/components/schemas/RegimeTributario" }
        inscricaoEstadual: { type: ["string", "null"] }
        inscricaoMunicipal: { type: ["string", "null"] }
        formaEnvio: { type: ["string", "null"] }
        procuracao: { type: ["string", "null"] }
        procuracaoVencimento: { type: ["string", "null"], format: date }
        socioNome: { type: ["string", "null"] }
        socioCpf: { type: ["string", "null"] }
        senhaGov: { type: ["string", "null"] }
        senhaNfse: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        valorHonorario: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        diaVencimentoHonorario: { type: ["integer", "null"], minimum: 1, maximum: 31 }
        contatoNome: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        ativo: { type: boolean }
        obrigacoes:
          type: array
          items: { type: integer }

    RegimeTributario:
      type: ["string", "null"]
      enum: [simples_nacional, mei, lucro_presumido, lucro_real, null]

    # Edição célula-a-célula na tela de Dados cadastrais: todos os campos são
    # opcionais e só o que vier no body é gravado (não mexe nas obrigações).
    ClientePatch:
      type: object
      properties:
        codigo: { type: ["integer", "null"], minimum: 0 }
        razaoSocial: { type: string, minLength: 1, maxLength: 200 }
        cnpj: { type: ["string", "null"] }
        cnaePrincipal: { type: ["string", "null"] }
        regime: { $ref: "#/components/schemas/RegimeTributario" }
        inscricaoEstadual: { type: ["string", "null"] }
        inscricaoMunicipal: { type: ["string", "null"] }
        formaEnvio: { type: ["string", "null"] }
        procuracao: { type: ["string", "null"] }
        procuracaoVencimento: { type: ["string", "null"], format: date }
        socioNome: { type: ["string", "null"] }
        socioCpf: { type: ["string", "null"] }
        senhaGov: { type: ["string", "null"] }
        senhaNfse: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        valorHonorario: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        diaVencimentoHonorario: { type: ["integer", "null"], minimum: 1, maximum: 31 }
        contatoNome: { type: ["string", "null"] }
        whatsapp: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        ativo: { type: boolean }

    Periodicidade:
      type: string
      enum: [mensal, bimestral, trimestral, semestral, anual]

    # Variante sem null, para usar dentro de listas.
    RegimeValor:
      type: string
      enum: [simples_nacional, mei, lucro_presumido, lucro_real]

    TipoObrigacao:
      type: object
      required: [id, nome, ordem, offsetMes, periodicidade, ativo, vincularAutomatico]
      properties:
        id: { type: integer }
        nome: { type: string, minLength: 1, maxLength: 200 }
        descricao: { type: ["string", "null"] }
        ordem: { type: integer, minimum: 0 }
        diaVencimento: { type: ["integer", "null"], minimum: 1, maximum: 31 }
        offsetMes: { type: integer, minimum: 0, maximum: 12 }
        periodicidade: { $ref: "#/components/schemas/Periodicidade" }
        mesReferencia: { type: ["integer", "null"], minimum: 1, maximum: 12 }
        # Lista vazia ou ausente = a obrigação vale para todos os regimes.
        regimes:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/RegimeValor" }
        # Ao definir o regime de um cliente, esta obrigação é vinculada sozinha
        # (se for do regime dele). Desmarcada = só à mão.
        vincularAutomatico: { type: boolean }
        # Inativa não entra em mês novo, mas o histórico dela fica.
        ativo: { type: boolean }

    TipoObrigacaoInput:
      type: object
      required: [nome]
      properties:
        id: { type: ["integer", "null"] }
        nome: { type: string, minLength: 1, maxLength: 200 }
        descricao: { type: ["string", "null"] }
        ordem: { type: integer, minimum: 0 }
        diaVencimento: { type: ["integer", "null"], minimum: 1, maximum: 31 }
        offsetMes: { type: integer, minimum: 0, maximum: 12 }
        periodicidade: { $ref: "#/components/schemas/Periodicidade" }
        mesReferencia: { type: ["integer", "null"], minimum: 1, maximum: 12 }
        # Lista vazia ou ausente = a obrigação vale para todos os regimes.
        regimes:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/RegimeValor" }
        vincularAutomatico: { type: boolean }
        ativo: { type: boolean }

    ResultadoVinculo:
      type: object
      required: [vinculosCriados]
      properties:
        vinculosCriados: { type: integer }

    StatusDebito:
      type: string
      enum: [em_aberto, parcelado, pago]

    Debito:
      type: object
      required: [id, clienteId, clienteNome, rotulo, status]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string, minLength: 1, maxLength: 200 }
        competenciaRef: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"], format: date }
        valor: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        status: { $ref: "#/components/schemas/StatusDebito" }
        observacao: { type: ["string", "null"] }

    DebitoInput:
      type: object
      required: [clienteId, rotulo]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: integer }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string, minLength: 1, maxLength: 200 }
        competenciaRef: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"], format: date }
        valor: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        status: { $ref: "#/components/schemas/StatusDebito" }
        observacao: { type: ["string", "null"] }

    DebitoPatch:
      type: object
      properties:
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string, minLength: 1, maxLength: 200 }
        competenciaRef: { type: ["string", "null"] }
        vencimento: { type: ["string", "null"], format: date }
        valor: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        status: { $ref: "#/components/schemas/StatusDebito" }
        observacao: { type: ["string", "null"] }

    Credencial:
      type: object
      required: [id, clienteId, clienteNome, rotulo, temSenha]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string, minLength: 1, maxLength: 200 }
        login: { type: ["string", "null"] }
        # A senha só sai por /credenciais/{id}/senha, com auditoria.
        temSenha: { type: boolean }
        observacao: { type: ["string", "null"] }

    CredencialInput:
      type: object
      required: [clienteId, rotulo]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: integer }
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string, minLength: 1, maxLength: 200 }
        login: { type: ["string", "null"] }
        senha: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    CredencialPatch:
      type: object
      properties:
        tipoObrigacaoId: { type: ["integer", "null"] }
        rotulo: { type: string, minLength: 1, maxLength: 200 }
        login: { type: ["string", "null"] }
        senha: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    CategoriaProcesso:
      type: string
      enum: [processo, pedido]

    StatusProcesso:
      type: string
      enum: [aberto, em_andamento, concluido, cancelado]

    Processo:
      type: object
      required: [id, clienteId, clienteNome, tipo, status, origem, totalEtapas, etapasFeitas]
      properties:
        id: { type: integer }
        clienteId: { type: integer }
        clienteNome: { type: string }
        tipo: { type: string }
        categoria: { $ref: "#/components/schemas/CategoriaProcesso" }
        titulo: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusProcesso" }
        orgao: { type: ["string", "null"] }
        protocolo: { type: ["string", "null"] }
        abertoEm: { type: ["string", "null"] }
        prazo: { type: ["string", "null"], format: date }
        concluidoEm: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        # `escritorio` ou `portal` (pedido aberto pelo próprio cliente).
        origem: { type: string }
        totalEtapas: { type: integer }
        etapasFeitas: { type: integer }

    ProcessoComEtapas:
      allOf:
        - $ref: "#/components/schemas/Processo"
        - type: object
          required: [etapas]
          properties:
            etapas:
              type: array
              items:
                $ref: "#/components/schemas/ProcessoEtapa"

    ProcessoInput:
      type: object
      required: [clienteId, tipo]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: integer }
        tipo: { type: string }
        categoria: { $ref: "#/components/schemas/CategoriaProcesso" }
        titulo: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/StatusProcesso" }
        orgao: { type: ["string", "null"] }
        protocolo: { type: ["string", "null"] }
        abertoEm: { type: ["string", "null"] }
        prazo: { type: ["string", "null"], format: date }
        concluidoEm: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    ProcessoEtapa:
      type: object
      required: [id, processoId, descricao, feito, ordem]
      properties:
        id: { type: integer }
        processoId: { type: integer }
        descricao: { type: string }
        feito: { type: boolean }
        ordem: { type: integer, minimum: 0 }
        concluidoEm: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    EtapaInput:
      type: object
      required: [descricao]
      properties:
        descricao: { type: string }
        observacao: { type: ["string", "null"] }

    EtapaPatch:
      type: object
      properties:
        descricao: { type: string }
        feito: { type: boolean }
        ordem: { type: integer, minimum: 0 }
        observacao: { type: ["string", "null"] }

    Competencia:
      type: object
      required: [id, ano, mes]
      properties:
        id: { type: integer }
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        mes: { type: integer, minimum: 1, maximum: 12 }
        rotulo: { type: ["string", "null"] }

    CompetenciaComResumo:
      type: object
      required: [id, ano, mes, resumo]
      properties:
        id: { type: integer }
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        mes: { type: integer, minimum: 1, maximum: 12 }
        rotulo: { type: ["string", "null"] }
        resumo:
          $ref: "#/components/schemas/Resumo"

    AbrirCompetenciaInput:
      type: object
      required: [ano, mes]
      properties:
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        mes: { type: integer, minimum: 1, maximum: 12 }
        # Para meses anteriores ao início do uso do sistema: gera só os
        # honorários (pagamentos), sem o checklist de obrigações daquele mês.
        somenteHonorarios: { type: boolean }

    ResultadoSincronizacao:
      type: object
      required: [itensCriados, pagamentosCriados]
      properties:
        itensCriados: { type: integer }
        pagamentosCriados: { type: integer }

    ChecklistItem:
      type: object
      required: [id, status, clienteId, cliente, tipoObrigacaoId, obrigacao, ordem, anexos, enviadoEm, visualizadoEm]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pendente, emitido, enviado, nao_aplica]
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"], minimum: 0 }
        cliente: { type: string }
        vencimento: { type: ["string", "null"], format: date }
        tipoObrigacaoId: { type: integer }
        obrigacao: { type: string }
        ordem: { type: integer, minimum: 0 }
        # Guias anexadas (confirmadas) e o último envio com protocolo.
        anexos: { type: integer }
        enviadoEm: { type: ["string", "null"], format: date-time }
        visualizadoEm: { type: ["string", "null"], format: date-time }

    EnviarGuiaInput:
      type: object
      required: [canal]
      properties:
        canal: { $ref: "#/components/schemas/CanalAviso" }
        # Texto livre que vai antes do aviso padrão.
        mensagem: { type: ["string", "null"], maxLength: 2000 }

    Protocolo:
      type: object
      required: [id, canal, link, enviadoEm, expiraEm, visualizadoEm, cienteEm, enviadoPor]
      properties:
        id: { type: integer }
        canal: { $ref: "#/components/schemas/CanalAviso" }
        # O token só existe em claro na resposta do envio; depois, só o hash.
        link: { type: ["string", "null"] }
        enviadoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
        visualizadoEm: { type: ["string", "null"], format: date-time }
        cienteEm: { type: ["string", "null"], format: date-time }
        enviadoPor: { type: ["string", "null"] }

    EnvioGuia:
      type: object
      required: [item, protocolo, linkWhatsapp]
      properties:
        item: { $ref: "#/components/schemas/ChecklistItem" }
        protocolo: { $ref: "#/components/schemas/Protocolo" }
        # Para mandar à mão pelo wa.me quando a conta não tem a API do WhatsApp.
        linkWhatsapp: { type: ["string", "null"] }

    Alertas:
      type: object
      required:
        [competenciaDoMesAberta, competenciaDoMesId, vencendo7Dias, emitidasNaoEnviadasVencidas,
         honorariosVencidos, feriasVencendo, procuracoesVencendo30Dias, procuracoesVencidas,
         processosAtrasados, avisosFalhados, clientesSemObrigacoes]
      properties:
        competenciaDoMesAberta: { type: boolean }
        competenciaDoMesId: { type: ["integer", "null"] }
        vencendo7Dias: { type: integer }
        emitidasNaoEnviadasVencidas: { type: integer }
        honorariosVencidos:
          type: object
          required: [quantidade, total]
          properties:
            quantidade: { type: integer }
            total: { type: string }
        feriasVencendo: { type: integer }
        procuracoesVencendo30Dias: { type: integer }
        procuracoesVencidas: { type: integer }
        processosAtrasados: { type: integer }
        avisosFalhados: { type: integer }
        clientesSemObrigacoes: { type: integer }

    Produtividade:
      type: object
      required: [periodo, porUsuario, porCliente]
      properties:
        periodo:
          type: object
          required: [de, ate, meses]
          properties:
            de: { type: string, format: date }
            ate: { type: string, format: date }
            meses: { type: integer }
        porUsuario:
          type: array
          items:
            type: object
            required: [usuarioId, login, nome, enviados, atrasadosNoEnvio, tempoMedioHoras]
            properties:
              usuarioId: { type: ["integer", "null"] }
              login: { type: ["string", "null"] }
              nome: { type: ["string", "null"] }
              enviados: { type: integer }
              atrasadosNoEnvio: { type: integer }
              tempoMedioHoras: { type: ["number", "null"] }
        porCliente:
          type: array
          items:
            type: object
            required: [clienteId, cliente, total, atrasadas]
            properties:
              clienteId: { type: integer }
              cliente: { type: string }
              total: { type: integer }
              atrasadas: { type: integer }

    StatusChecklistInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pendente, emitido, enviado, nao_aplica]

    VencimentoInput:
      type: object
      properties:
        vencimento: { type: ["string", "null"], format: date }

    Pagamento:
      type: object
      required: [id, status, clienteId, cliente, linkPagamento, qrPix, cobrancaExternaId]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [pendente, pago, isento]
        valor: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        dataPagamento: { type: ["string", "null"], format: date }
        vencimento: { type: ["string", "null"], format: date }
        forma: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"], minimum: 0 }
        cliente: { type: string }
        # Cobrança no provedor (Asaas), quando gerada.
        cobrancaExternaId: { type: ["string", "null"] }
        linkPagamento: { type: ["string", "null"] }
        qrPix: { type: ["string", "null"] }

    PagamentoInput:
      type: object
      properties:
        status:
          type: string
          enum: [pendente, pago, isento]
        valor: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        dataPagamento: { type: ["string", "null"], format: date }
        vencimento: { type: ["string", "null"], format: date }
        forma: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    ObrigacaoAtrasada:
      type: object
      required: [id, competenciaId, ano, mes, status, diasAtraso, clienteId, cliente, obrigacao]
      properties:
        id: { type: integer }
        competenciaId: { type: integer }
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        mes: { type: integer, minimum: 1, maximum: 12 }
        # `pendente` = nem emitida; `emitido` = pronta, mas não chegou ao cliente.
        status:
          type: string
          enum: [pendente, emitido]
        vencimento: { type: ["string", "null"], format: date }
        diasAtraso: { type: integer }
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"], minimum: 0 }
        cliente: { type: string }
        obrigacao: { type: string }

    Inadimplente:
      type: object
      required: [id, competenciaId, ano, mes, diasAtraso, clienteId, cliente]
      properties:
        linkPagamento: { type: ["string", "null"] }
        id: { type: integer }
        competenciaId: { type: integer }
        ano: { type: integer, minimum: 2000, maximum: 2100 }
        mes: { type: integer, minimum: 1, maximum: 12 }
        valor: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        vencimento: { type: ["string", "null"], format: date }
        diasAtraso: { type: integer }
        clienteId: { type: integer }
        codigo: { type: ["integer", "null"], minimum: 0 }
        cliente: { type: string }
        whatsapp: { type: ["string", "null"] }
        cobradoEm: { type: ["string", "null"] }

    Pendencias:
      type: object
      required: [obrigacoes, inadimplentes]
      properties:
        obrigacoes:
          type: array
          items:
            $ref: "#/components/schemas/ObrigacaoAtrasada"
        inadimplentes:
          type: array
          items:
            $ref: "#/components/schemas/Inadimplente"

    CobrancaInput:
      type: object
      required: [pagamentoId]
      properties:
        pagamentoId: { type: integer }

    Configuracao:
      type: object
      required: [chave, valor]
      properties:
        chave: { type: string }
        valor: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }

    ConfiguracaoInput:
      type: object
      required: [valor]
      properties:
        valor: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }

    # Filtro dos registros que existem para o escritório e para os clientes:
    # `escritorio` = só os sem cliente, `clientes` = só os com cliente.
    EscopoRegistro:
      type: string
      enum: [todos, escritorio, clientes]

    Perfil:
      type: object
      required: [id, nome, aberturaAutomatica, diasParaCobrar]
      properties:
        id: { type: integer }
        nome: { type: string, minLength: 1, maxLength: 200 }
        cnpj: { type: ["string", "null"] }
        responsavel: { type: ["string", "null"] }
        crc: { type: ["string", "null"] }
        telefone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }
        chavePix: { type: ["string", "null"] }
        # Abre o mês sozinho no dia 1 (job abrir-competencia).
        aberturaAutomatica: { type: boolean }
        # Dias depois do vencimento para o aviso de honorário em aberto.
        diasParaCobrar: { type: integer, minimum: 0, maximum: 90 }

    PerfilInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 1 }
        cnpj: { type: ["string", "null"] }
        responsavel: { type: ["string", "null"] }
        crc: { type: ["string", "null"] }
        telefone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }
        chavePix: { type: ["string", "null"] }
        aberturaAutomatica: { type: boolean }
        diasParaCobrar: { type: integer, minimum: 0, maximum: 90 }

    Despesa:
      type: object
      required: [id, data, categoria, descricao, valor, pago]
      properties:
        id: { type: integer }
        clienteId: { type: ["integer", "null"] }
        clienteNome: { type: ["string", "null"] }
        data: { type: string, format: date }
        categoria: { type: string }
        descricao: { type: string }
        valor: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
        vencimento: { type: ["string", "null"], format: date }
        formaPagamento: { type: ["string", "null"] }
        pago: { type: boolean }
        observacao: { type: ["string", "null"] }

    DespesaInput:
      type: object
      required: [data, categoria, descricao, valor]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: ["integer", "null"] }
        data: { type: string, format: date }
        categoria: { type: string, minLength: 1 }
        descricao: { type: string, minLength: 1 }
        valor: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
        vencimento: { type: ["string", "null"], format: date }
        formaPagamento: { type: ["string", "null"] }
        pago: { type: boolean }
        observacao: { type: ["string", "null"] }

    DespesaPatch:
      type: object
      properties:
        clienteId: { type: ["integer", "null"] }
        data: { type: string, format: date }
        categoria: { type: string }
        descricao: { type: string }
        valor: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
        vencimento: { type: ["string", "null"], format: date }
        formaPagamento: { type: ["string", "null"] }
        pago: { type: boolean }
        observacao: { type: ["string", "null"] }

    SituacaoFuncionario:
      type: string
      enum: [ativo, ferias, afastado, demitido]

    Funcionario:
      type: object
      required: [id, nome, situacao]
      properties:
        id: { type: integer }
        clienteId: { type: ["integer", "null"] }
        clienteNome: { type: ["string", "null"] }
        nome: { type: string, minLength: 1, maxLength: 200 }
        cpf: { type: ["string", "null"] }
        rg: { type: ["string", "null"] }
        pis: { type: ["string", "null"] }
        ctps: { type: ["string", "null"] }
        nascimento: { type: ["string", "null"], format: date }
        cargo: { type: ["string", "null"] }
        admissao: { type: ["string", "null"], format: date }
        demissao: { type: ["string", "null"], format: date }
        salario: { type: ["string", "null"], pattern: '^-?\d+(\.\d{1,2})?$' }
        situacao: { $ref: "#/components/schemas/SituacaoFuncionario" }
        telefone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        endereco: { type: ["string", "null"] }
        observacao: { type: ["string", "null"] }

    FuncionarioInput:
      type: object
      required: [nome]
      properties:
        id: { type: ["integer", "null"] }
        clienteId: { type: ["integer", "null"] }
        nome: { type: string, minLength: 1 }
        cpf: { type: ["string", "null"] }
        rg: { type: ["string", "null"] }
        pis: { type: ["string", "null"] }
        ctps: { type: ["string", "null"] }
        nascimento: { type: ["string", "null"], format: date }
        cargo: { type: ["string", "null"] }
        admissao: { type: ["string", "null"], format: date }
        demissao: { type: ["string", "null"], format: date }
