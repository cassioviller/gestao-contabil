        descontos: { type: ["string", "null"] }
        inss: { type: ["string", "null"] }
        fgts: { type: ["string", "null"] }
        irrf: { type: ["string", "null"] }
        liquido: { type: ["string", "null"] }
        pago: { type: boolean }
        pagoEm: { type: ["string", "null"] }
